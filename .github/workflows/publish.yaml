name: Publish

on:
  release:
    types: [published]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
      with:
        java-version: '21'
        distribution: 'corretto'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

    - name: Parse version from tag
      id: version
      uses: release-kit/semver@97491c46500b6e758ced599794164a234b8aa08c # v2

    - name: Publish to Reposilite
      run: ./gradlew clean build publish -Pversion=${{ steps.version.outputs.full }}
      env:
        REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
        REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
